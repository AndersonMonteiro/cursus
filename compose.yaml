name: cursus

# Every value comes from .env (see .env.example). A missing variable stops
# Compose with an error that names it, so nothing falls back to a default.

x-langfuse-depends-on: &langfuse-depends-on
  postgres:
    condition: service_healthy
  clickhouse:
    condition: service_healthy
  redis:
    condition: service_healthy
  minio:
    condition: service_healthy

x-langfuse-env: &langfuse-env
  NEXTAUTH_URL: http://localhost:${LANGFUSE_PORT:?}
  DATABASE_URL: postgresql://${LANGFUSE_POSTGRES_USER:?}:${LANGFUSE_POSTGRES_PASSWORD:?}@postgres:5432/${LANGFUSE_POSTGRES_DB:?}
  SALT: ${LANGFUSE_SALT:?}
  ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY:?}
  TELEMETRY_ENABLED: ${LANGFUSE_TELEMETRY_ENABLED:?}
  CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
  CLICKHOUSE_URL: http://clickhouse:8123
  CLICKHOUSE_USER: ${CLICKHOUSE_USER:?}
  CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?}
  CLICKHOUSE_CLUSTER_ENABLED: "false"
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_AUTH: ${REDIS_AUTH:?}
  LANGFUSE_S3_EVENT_UPLOAD_BUCKET: ${LANGFUSE_S3_BUCKET:?}
  LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
  LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?}
  LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?}
  LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
  LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
  LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: ${LANGFUSE_S3_BUCKET:?}
  LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
  LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?}
  LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?}
  LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://minio:9000
  LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/

services:
  postgres:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
      LANGFUSE_POSTGRES_USER: ${LANGFUSE_POSTGRES_USER:?}
      LANGFUSE_POSTGRES_PASSWORD: ${LANGFUSE_POSTGRES_PASSWORD:?}
      LANGFUSE_POSTGRES_DB: ${LANGFUSE_POSTGRES_DB:?}
      # Langfuse does not support a Postgres server running outside UTC.
      TZ: UTC
      PGTZ: UTC
    configs:
      - source: postgres-init-langfuse
        target: /docker-entrypoint-initdb.d/10-init-langfuse.sh
    ports:
      - 127.0.0.1:${POSTGRES_PORT:?}:5432
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20

  temporal:
    image: temporalio/temporal:1.10.1
    restart: unless-stopped
    # The dev server keeps its state in SQLite. The file is only initialised
    # when absent, so an image upgrade may need the volume recreated.
    command: server start-dev --ip 0.0.0.0 --db-filename /home/temporal/temporal.db
    ports:
      - 127.0.0.1:${TEMPORAL_PORT:?}:7233
      - 127.0.0.1:${TEMPORAL_UI_PORT:?}:8233
    volumes:
      - temporal-data:/home/temporal
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "localhost:7233"]
      interval: 5s
      timeout: 5s
      retries: 20

  langfuse-web:
    image: langfuse/langfuse:4.83.0
    restart: unless-stopped
    depends_on: *langfuse-depends-on
    environment:
      <<: *langfuse-env
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:?}
      # The browser uploads media straight to MinIO, so this endpoint is the
      # host-side address; the server reaches MinIO through the internal one.
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://localhost:${MINIO_PORT:?}
      LANGFUSE_S3_MEDIA_UPLOAD_INTERNAL_ENDPOINT: http://minio:9000
    ports:
      - 127.0.0.1:${LANGFUSE_PORT:?}:3000
    healthcheck:
      # Both Langfuse servers listen on the container hostname only, so a
      # probe against loopback is refused.
      test: ["CMD-SHELL", "wget --quiet --spider http://$$HOSTNAME:3000/api/public/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 180s
      start_interval: 5s

  langfuse-worker:
    image: langfuse/langfuse-worker:4.83.0
    restart: unless-stopped
    depends_on: *langfuse-depends-on
    environment: *langfuse-env
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --spider http://$$HOSTNAME:3030/api/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 180s
      start_interval: 5s

  clickhouse:
    image: clickhouse/clickhouse-server:26.3.62.3
    restart: unless-stopped
    user: "101:101"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:?}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?}
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - clickhouse-logs:/var/log/clickhouse-server
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4.12
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_AUTH:?}", "--maxmemory-policy", "noeviction"]
    environment:
      REDISCLI_AUTH: ${REDIS_AUTH:?}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 3s
      timeout: 5s
      retries: 20

  minio:
    # The image publishes no versioned tags, so it is pinned by digest
    # (MinIO RELEASE.2026-11-16T00-11-40Z).
    image: cgr.dev/chainguard/minio@sha256:e9cf6b99c226e9539ed0f14b6f00e37b07da153c7ba1f4f8709c807574b471ec
    restart: unless-stopped
    entrypoint: sh
    # A directory under the data root is a bucket; creating it here avoids a
    # separate bootstrap container.
    command: -c 'mkdir -p "/data/$$LANGFUSE_S3_BUCKET" && minio server --address ":9000" --console-address ":9001" /data'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?}
      LANGFUSE_S3_BUCKET: ${LANGFUSE_S3_BUCKET:?}
    ports:
      - 127.0.0.1:${MINIO_PORT:?}:9000
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 5s
      retries: 20

configs:
  # Langfuse migrates the public schema of its database, so it gets a database
  # of its own on the shared server, owned by a role without superuser rights.
  # Revoking CONNECT from PUBLIC keeps that role out of the Cursus database.
  # Init scripts run only on an empty volume.
  postgres-init-langfuse:
    content: |
      psql --set ON_ERROR_STOP=1 --username "$$POSTGRES_USER" --dbname "$$POSTGRES_DB" \
        --set langfuse_user="$$LANGFUSE_POSTGRES_USER" \
        --set langfuse_password="$$LANGFUSE_POSTGRES_PASSWORD" \
        --set langfuse_db="$$LANGFUSE_POSTGRES_DB" \
        --set cursus_db="$$POSTGRES_DB" <<'SQL'
      CREATE ROLE :"langfuse_user" LOGIN PASSWORD :'langfuse_password';
      CREATE DATABASE :"langfuse_db" OWNER :"langfuse_user";
      REVOKE CONNECT ON DATABASE :"cursus_db" FROM PUBLIC;
      SQL

volumes:
  postgres-data:
  temporal-data:
  clickhouse-data:
  clickhouse-logs:
  redis-data:
  minio-data:
